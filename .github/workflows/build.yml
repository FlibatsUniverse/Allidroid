name: Allidroid Build
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: allidroid-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version: 17
          distribution: temurin
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Build bundle
        working-directory: bundle
        run: |
          bun install --frozen-lockfile
          node scripts/build.mjs --build-minify
          node scripts/buildPlugins.mjs
      - name: Build APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Allidroid-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            bundle/dist/allidroid.min.js
            bundle/dist/plugins.json
          if-no-files-found: error
